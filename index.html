<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Mirror failover. gmango.dev is blocked by some school and corporate
         filters, which reset the TLS connection on the SNI hostname alone; a
         blocked origin never reaches the browser, so it cannot redirect anyone.
         Only the hostname that loaded can decide. This runs first, before the
         fonts and the bundle, so a visitor who can reach the real domain is
         handed over before anything paints. `?stay=1` links the mirror on
         purpose. The result is shared with src/lib/originProbe.ts. -->
    <script>
      (function () {
        if (location.hostname !== 'shankyshako.github.io') return;
        if (new URLSearchParams(location.search).has('stay')) return;

        var KEY = 'canon-reachable';
        var read = function () {
          try { return sessionStorage.getItem(KEY); } catch (e) { return null; }
        };
        var write = function (v) {
          try { sessionStorage.setItem(KEY, v); } catch (e) {}
        };
        var go = function () {
          location.replace(
            'https://gmango.dev' + location.pathname + location.search + location.hash
          );
        };

        var seen = read();
        if (seen === '1') return go();
        if (seen === '0') return;

        var ac = new AbortController();
        var timer = setTimeout(function () { ac.abort(); }, 1500);
        fetch('https://gmango.dev/image/favicon-32.png', {
          mode: 'no-cors',
          cache: 'no-store',
          signal: ac.signal
        }).then(function () {
          clearTimeout(timer);
          write('1');
          go();
        }).catch(function () {
          clearTimeout(timer);
          write('0');
        });
      })();
    </script>

    <link rel="icon" href="/image/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/image/favicon-16.png" type="image/png" sizes="16x16" />
