<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to gmango.dev</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://gmango.dev/" />
    <meta http-equiv="refresh" content="0; url=https://gmango.dev/" />
    <script>
      // Carry the path, query and hash across so deep links survive the hop.
      location.replace(
        "https://gmango.dev" + location.pathname + location.search + location.hash
      );
    </script>
  </head>
  <body>
    <p>This site has moved to <a href="https://gmango.dev/">gmango.dev</a>.</p>
  </body>
</html>
